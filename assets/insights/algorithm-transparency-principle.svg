<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">The Algorithm Transparency Principle</title><desc id="desc">Four criteria for trustworthy sporting algorithms: accuracy, fairness, transparency and verifiability.</desc><defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#061b2f"/><stop offset="1" stop-color="#0b3150"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".18"/></filter></defs><rect width="1400" height="650" rx="28" fill="#f7fafb"/><rect width="1400" height="110" rx="28" fill="url(#head)"/><path d="M0 80h1400v30H0z" fill="url(#head)"/><text x="700" y="58" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800">THE ALGORITHM TRANSPARENCY PRINCIPLE</text><text x="700" y="145" text-anchor="middle" fill="#15354c" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Every sporting algorithm should satisfy four criteria</text><g font-family="Arial,Helvetica,sans-serif" filter="url(#s)"><g transform="translate(45 185)"><rect width="300" height="350" rx="22" fill="#eef9fa" stroke="#168c96" stroke-width="3"/><circle cx="150" cy="72" r="48" fill="#13858e"/><path d="M125 74l19 19 38-47M150 24v18M150 102v18M102 72H84M216 72h-18" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="155" text-anchor="middle" fill="#13747c" font-size="28" font-weight="800">1. ACCURACY</text><text x="150" y="205" text-anchor="middle" fill="#18232b" font-size="21"><tspan x="150">Does the algorithm</tspan><tspan x="150" dy="29">correctly apply the</tspan><tspan x="150" dy="29">published rules?</tspan></text></g><g transform="translate(380 185)"><rect width="300" height="350" rx="22" fill="#f3f8ed" stroke="#648c36" stroke-width="3"/><circle cx="150" cy="72" r="48" fill="#638a35"/><path d="M150 28v78M112 48h76M112 48l-28 55h56zM188 48l-28 55h56z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><text x="150" y="155" text-anchor="middle" fill="#567b2c" font-size="28" font-weight="800">2. FAIRNESS</text><text x="150" y="205" text-anchor="middle" fill="#18232b" font-size="21"><tspan x="150">Does it minimise</tspan><tspan x="150" dy="29">systematic advantage</tspan><tspan x="150" dy="29">or disadvantage across</tspan><tspan x="150" dy="29">eligible competitors?</tspan></text></g><g transform="translate(715 185)"><rect width="300" height="350" rx="22" fill="#fff8e8" stroke="#d88616" stroke-width="3"/><circle cx="150" cy="72" r="48" fill="#d88616"/><circle cx="137" cy="60" r="24" fill="none" stroke="#fff" stroke-width="9"/><path d="M155 80l27 27" stroke="#fff" stroke-width="10" stroke-linecap="round"/><text x="150" y="155" text-anchor="middle" fill="#c16e08" font-size="28" font-weight="800">3. TRANSPARENCY</text><text x="150" y="205" text-anchor="middle" fill="#18232b" font-size="21"><tspan x="150">Can athletes, coaches</tspan><tspan x="150" dy="29">and spectators understand</tspan><tspan x="150" dy="29">how the outcome</tspan><tspan x="150" dy="29">was reached?</tspan></text></g><g transform="translate(1050 185)"><rect width="300" height="350" rx="22" fill="#f7f0fa" stroke="#7b4a88" stroke-width="3"/><circle cx="150" cy="72" r="48" fill="#75417f"/><rect x="121" y="43" width="58" height="69" rx="5" fill="none" stroke="#fff" stroke-width="8"/><path d="M133 62h34M133 78h34M133 94h22" stroke="#fff" stroke-width="6"/><text x="150" y="155" text-anchor="middle" fill="#693875" font-size="28" font-weight="800">4. VERIFIABILITY</text><text x="150" y="205" text-anchor="middle" fill="#18232b" font-size="21"><tspan x="150">Can an independent</tspan><tspan x="150" dy="29">observer reproduce</tspan><tspan x="150" dy="29">the calculation using</tspan><tspan x="150" dy="29">public information?</tspan></text></g></g><path d="M285 590h830" stroke="#1b99a3" stroke-width="3"/><circle cx="245" cy="590" r="25" fill="#13858e"/><path d="M232 590l9 10 18-23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="700" y="600" text-anchor="middle" fill="#102c4c" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800">When all four are met, athletes and spectators can trust the result.</text></svg>