<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">The Invisible Referee</title><desc id="desc">A vacant para powerlifting bench with a long, wide platform, equal red plates on both sides of the bar, mathematical scoring notation and a teal performance curve.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020405"/><stop offset="1" stop-color="#0a1519"/></linearGradient><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d9dee0"/><stop offset=".5" stop-color="#7f898d"/><stop offset="1" stop-color="#30383b"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".55"/></filter></defs>
<rect width="1600" height="760" fill="url(#bg)"/>
<g opacity=".15" stroke="#00b7c7"><path d="M930 120H1540M930 170H1540M930 220H1540M930 270H1540M930 320H1540M930 370H1540M980 80V430M1080 80V430M1180 80V430M1280 80V430M1380 80V430M1480 80V430"/></g>
<g fill="#28c8d2" font-family="Arial,Helvetica,sans-serif"><text x="70" y="72" font-size="28" font-weight="700" letter-spacing="2">BEYOND THE SCOREBOARD · #1</text><text x="70" y="194" font-size="86" font-weight="800" fill="#fff">The Invisible</text><text x="70" y="284" font-size="86" font-weight="800" fill="#fff">Referee</text><text x="70" y="358" font-size="38" font-weight="700">What the Commonwealth Games</text><text x="70" y="408" font-size="38" font-weight="700">taught us about sporting algorithms</text><text x="70" y="474" font-size="27" font-style="italic" fill="#fff">By Dr Daniel van den Hoek</text></g>
<g font-family="Georgia,serif" fill="#5ed7dd" font-size="29" opacity=".92"><text x="970" y="72">AH score = lift × bodyweight coefficient</text><text x="1040" y="116">score = L / f(BW)</text></g>
